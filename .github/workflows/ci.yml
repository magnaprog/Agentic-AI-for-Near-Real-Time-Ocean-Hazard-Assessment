name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: mypy src/
      # Mission Control BFF (mission-control/backend) had no lint/type gate,
      # so lint/type drift accumulated there unnoticed. Gate it with the same
      # ruff/mypy config as the core package.
      - run: pip install -r mission-control/requirements.txt
      - name: Lint and type-check Mission Control BFF
        working-directory: mission-control
        run: |
          ruff check backend/
          mypy --config-file ../pyproject.toml backend/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ tests/simulation/ --cov=src/hazard_assessment --cov-branch --cov-fail-under=85 -q

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real PostgreSQL service so the live-DB provisioning tests (migrations,
    # append-only triggers, get_provenance privileges and search_path
    # hardening, FSM persist/load round-trip, advisory locks) actually run
    # instead of silently skipping.
    services:
      postgres:
        # Same image the deploy stack uses (deploy/docker-compose.yml):
        # migration 001 runs CREATE EXTENSION timescaledb, which plain
        # postgres:16 does not ship.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: hazard_admin
          POSTGRES_PASSWORD: hazard_admin_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hazard_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The live-DB tests skip (not fail) when PostgreSQL is unreachable, so a
      # connectivity regression would leave this job green with zero live-DB
      # coverage. Fail here instead. The wait also covers the TimescaleDB
      # entrypoint restarting the server after init, which pg_isready over the
      # container socket can answer during.
      - name: Require a reachable PostgreSQL before running the suite
        run: |
          python - <<'PY'
          import sys, time
          import psycopg
          last = None
          for _ in range(30):
              try:
                  psycopg.connect(
                      host="localhost", port=5432, dbname="postgres",
                      user="hazard_admin", password="hazard_admin_pw",
                      connect_timeout=5,
                  ).close()
                  print("PostgreSQL reachable")
                  sys.exit(0)
              except psycopg.OperationalError as exc:
                  last = exc
                  time.sleep(2)
          sys.exit(f"PostgreSQL never became reachable: {last}")
          PY
      - run: pytest tests/integration/ -q
        env:
          DB_ADMIN_USER: hazard_admin
          DB_ADMIN_PASSWORD: hazard_admin_pw

  safety-tests:
    name: Safety Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/safety/ -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mission-control/frontend/package-lock.json
      - run: npm ci
        working-directory: mission-control/frontend
      - run: npm run lint
        working-directory: mission-control/frontend
      # Gate on advisories in the SHIPPED bundle (production deps) only. The
      # frontend builds to a static bundle; dev/build tooling (vite, jsdom,
      # esbuild, undici, ...) never reaches users, so hard-failing CI on
      # transitive dev-tooling advisories blocked unrelated PRs repeatedly for
      # zero shipped-code risk. Production-dep advisories still hard-fail here.
      # A non-blocking full audit surfaces dev advisories without gating.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mission-control/frontend
      - run: npm audit --audit-level=high || true
        working-directory: mission-control/frontend
      - run: npm test
        working-directory: mission-control/frontend
      - run: npm run build
        working-directory: mission-control/frontend

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml config --quiet
      # Validating the compose file does not compile a Dockerfile. Build the
      # images too, or a broken build context ships undetected.
      - run: docker compose -f deploy/docker-compose.yml build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Upgrade pip first: the runner's bundled pip trips its own advisory
      # (PYSEC-2026-196, fixed in 26.1.2), which pip-audit would otherwise
      # report against the build tool rather than a project dependency.
      - run: python -m pip install --upgrade pip
      # Audit what the images actually ship, not just the dev extra: the core
      # image installs ".[telemetry,llm]" (deploy/Dockerfile) and the BFF
      # installs mission-control/requirements.txt. Without these, a CVE in the
      # OTLP/gRPC or LLM client dependency trees would not be reported.
      - run: pip install -e ".[dev,telemetry,llm]" -r mission-control/requirements.txt pip-audit
      - run: pip-audit --skip-editable
